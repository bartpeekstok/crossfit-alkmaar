<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/start/">
<title>Gratis kennismaking — CrossFit Alkmaar</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--cfa-white); font-family: 'Barlow', sans-serif; color: var(--fg1); }
  #app { min-height: 100vh; }
  a { -webkit-tap-highlight-color: transparent; }
  img { display: block; }

  /* Responsive — mobile-first traffic from Meta ads */
  @media (max-width: 860px) {
    .lp-hero-grid { grid-template-columns: 1fr !important; }
    .lp-why-grid { grid-template-columns: 1fr !important; }
    .lp-final-grid { grid-template-columns: 1fr !important; }
    .lp-footer-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 620px) {
    .lp-statbar { grid-template-columns: 1fr 1fr !important; row-gap: 28px !important; }
    .lp-statbar > div:nth-child(3) { border-left: none !important; }
    .lp-footer-grid { grid-template-columns: 1fr !important; }
    .lp-hide-sm { display: none !important; }
    /* community photos: swipeable strip instead of an orphaned 2+1 grid */
    .lp-photoband {
      display: flex !important; grid-template-columns: none !important;
      overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; gap: 12px !important;
      padding-bottom: 8px; scrollbar-width: none;
    }
    .lp-photoband::-webkit-scrollbar { display: none; }
    .lp-photoband > image-slot {
      flex: 0 0 80% !important; width: 80% !important; scroll-snap-align: center;
    }
  }

  /* image-slot fills its frame */
  image-slot { display: block; }
  image-slot::part(image) { object-fit: cover; }
</style>
</head>
<body>
<div id="app"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0B0F1E"/>
    <rect x="20" y="40" width="60" height="8" fill="#183090"/>
    <rect x="20" y="54" width="60" height="3" fill="#A8A8A8"/>
    <text x="50" y="33" fill="#fff" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle">CFA</text>
  </svg>
</template>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="lp-LeadForm.jsx"></script>
<script type="text/babel" src="lp-Hero.jsx"></script>
<script type="text/babel" src="lp-Sections.jsx"></script>
<script type="text/babel" src="lp-Footer.jsx"></script>
<script type="text/babel" src="lp-App.jsx"></script>
</body>
</html>
